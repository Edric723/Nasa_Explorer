<ion-buttons>
  <ion-button [id]="idBoton">
    <ion-icon name="grid-outline" slot="icon-only"></ion-icon>
  </ion-button>
</ion-buttons>

<ion-popover
  [trigger]="idBoton"
  triggerAction="click"
  side="bottom"
  alignment="end"
  [dismissOnSelect]="true">
  <ng-template>
    <ion-list lines="none">
      <ion-item button routerLink="/tabs/menu/integrantes">
        <ion-icon name="people-outline" slot="start"></ion-icon>
        <ion-label>Integrantes</ion-label>
      </ion-item>

      <ion-item button routerLink="/tabs/menu/acerca-de">
        <ion-icon name="book-outline" slot="start"></ion-icon>
        <ion-label>Acerca de</ion-label>
      </ion-item>

      <ion-item button (click)="cerrarSesion()">
        <ion-icon name="log-out-outline" slot="start"></ion-icon>
        <ion-label>Cerrar sesión</ion-label>
      </ion-item>
    </ion-list>
  </ng-template>
</ion-popover>
