
<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Imagen Astronómica del Día
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <div *ngIf="cargando" class="estado">
    <ion-spinner name="crescent"></ion-spinner>
    <p>Cargando imagen astronómica...</p>
  </div>

  <ion-card *ngIf="apod && !cargando">

    <img
      *ngIf="apod.media_type === 'image' && apod.hdurl"
      [src]="apod.hdurl"
      [alt]="apod.alt || apod.title"
    >

    <ion-card-header>
      <ion-card-subtitle>
        {{ apod.date }}
      </ion-card-subtitle>

      <ion-card-title>
        {{ apod.title }}
      </ion-card-title>
    </ion-card-header>

    <ion-card-content>

      <p>{{ apod.explanation }}</p>

      <p *ngIf="apod.copyright">
        <strong>Copyright:</strong> {{ apod.copyright }}
      </p>

      <p *ngIf="apod.credit">
        <strong>Créditos:</strong> {{ apod.credit }}
      </p>

      <ion-button
        *ngIf="apod.media_type !== 'image' && apod.permalink"
        [href]="apod.permalink"
        target="_blank"
        rel="noopener noreferrer"
      >
        Ver contenido multimedia
      </ion-button>

    </ion-card-content>

  </ion-card>

  <div *ngIf="error && !cargando" class="estado">
    <ion-icon name="alert-circle-outline"></ion-icon>
    <p>{{ error }}</p>
  </div>

</ion-content>
