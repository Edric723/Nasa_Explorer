<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Imagen Astronómica del Día
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <!-- Estado de carga -->
  <div *ngIf="cargando()" class="estado">
    <ion-spinner name="crescent"></ion-spinner>
    <p>Recibiendo transmisión astronómica...</p>
  </div>

  <!-- Card de APOD -->
  <ion-card *ngIf="apod() && !cargando()">

    <!-- Imagen -->
    <div class="contenedor-imagen"
         *ngIf="apod()?.media_type === 'image' && imagenUrl">
      <img
        [src]="imagenUrl"
        [alt]="apod()?.alt || apod()?.title"
        loading="lazy"
        decoding="async"
        (click)="ampliarImagen()">
    </div>

    <!-- Video -->
    <div class="contenedor-video"
         *ngIf="apod()?.media_type === 'video' && videoUrl()">
      <video
        [src]="videoUrl()"
        controls
        playsinline
        preload="metadata">
      </video>
    </div>

    <!-- Fecha -->
    <ion-card-header>
      <ion-card-subtitle>
        {{ apod()?.date }}
      </ion-card-subtitle>

      <ion-card-title>
        {{ apod()?.title }}
      </ion-card-title>
    </ion-card-header>

    <img class="apod-image" [src]="imagen.url" [alt]="imagen.title">

    <ion-card-content>

      <!-- Descripción -->
      <div class="descripcion" [innerHTML]="apod()?.explanation"></div>

      <!-- Créditos -->
      <div class="creditos" *ngIf="apod()?.copyright">
        <strong>Copyright: </strong>
        <span [innerHTML]="apod()?.copyright"></span>
      </div>

    </ion-card-content>
  </ion-card>

  <!-- Estado de error -->
  <div *ngIf="error() && !cargando()" class="estado error">
    <ion-icon name="alert-circle-outline"></ion-icon>
    <p>{{ error() }}</p>
  </div>

</ion-content>
