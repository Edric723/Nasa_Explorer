<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Imagen Astronómica del Día
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <ion-card>
    <img src="https://placehold.co/600x400" alt="Imagen astronómica">

    <ion-card-header>
      <ion-card-title>Imagen Astronómica del Día</ion-card-title>
    </ion-card-header>

    <ion-card-content>
      Imagen astronómica de ejemplo.
    </ion-card-content>
  </ion-card>

  <ion-list>
    <ion-item-sliding *ngFor="let tarjeta of cardService.tarjetas()">

      <ion-item>
        <ion-label>{{ tarjeta.titulo }}</ion-label>
      </ion-item>

      <ion-item-options side="start">
        <ion-item-option color="warning" (click)="editarTarjeta(tarjeta)">
          Editar
        </ion-item-option>
      </ion-item-options>

      <ion-item-options side="end">
        <ion-item-option color="danger" (click)="eliminarTarjeta(tarjeta)">
          Eliminar
        </ion-item-option>
      </ion-item-options>

    </ion-item-sliding>
  </ion-list>

</ion-content>
