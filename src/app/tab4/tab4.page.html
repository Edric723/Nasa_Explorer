<ion-header>
  <ion-toolbar>
    <ion-title>IFTS N° 11</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-card class="team-photo-card">
    <ion-card-header>
      <ion-card-title>Integrantes del grupo</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <div class="team-photos">
        <div class="team-member">
          <img src="/assets/img/backgrounds/kevin.png" alt="Kevin Puentes" />
          <span>Kevin</span>
        </div>
        <div class="team-member">
          <img src="/assets/img/backgrounds/eleonora.png" alt="Eleonora Paoletti" />
          <span>Eleonora</span>
        </div>
        <div class="team-member">
          <img src="/assets/img/backgrounds/julio.png" alt="Julio Cesar Martin" />
          <span>Julio Cesar</span>
        </div>
        <div class="team-member">
          <img src="/assets/img/backgrounds/george.png" alt="George Quispe" />
          <span>George</span>
        </div>
      </div>
    </ion-card-content>
  </ion-card>

  <ion-fab slot="fixed" vertical="bottom" horizontal="end">
    <ion-fab-button routerLink="/tabs/tab4/about">
      <ion-icon name="add-outline"></ion-icon>
    </ion-fab-button>
    <ion-fab-list side="top">
      <ion-fab-button routerLink="/tabs/tab4/document">
        <ion-icon name="accessibility-outline"></ion-icon>
      </ion-fab-button>
      <ion-fab-button>
        <ion-icon name="happy-outline"></ion-icon>
      </ion-fab-button>
      <ion-fab-button routerLink="/tabs/tab4/globe">
        <ion-icon name="exit-outline"></ion-icon>
      </ion-fab-button>
    </ion-fab-list>
  </ion-fab>
</ion-content>
