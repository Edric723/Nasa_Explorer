<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/tab4"></ion-back-button>
    </ion-buttons>
    <ion-title>Cuenta</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="account-cards">
    <ion-card class="logout-card">
      <ion-card-header>
        <ion-card-title>See you space cowboy!</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <p>A continuación haz click en cerrar sesión si deseas abandonar la app.</p>

        <ion-button expand="block" (click)="cerrarSesion()">
          Cerrar sesión
        </ion-button>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
