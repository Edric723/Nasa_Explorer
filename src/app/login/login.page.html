<ion-header>
  <ion-toolbar>
    <ion-title><ion-icon name="planet-outline"></ion-icon>
      NASA Explorer</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <div class="login-container">
    <div class="login-panel">

      <h1>Bienvenido</h1>

      <p>Iniciá sesión para acceder a NASA Explorer.</p>

      <ion-button expand="block" (click)="login()">
        Iniciar sesión
      </ion-button>
    </div>
  </div>

</ion-content>
